<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Calibri, 'Segoe UI', Lato, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="13" y="14" width="144" height="46" rx="9" fill="#DEE8F6" stroke="#6A93CF" stroke-width="1.6"/><text x="85.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">Analyst (browser)</text><line x1="85" y1="60" x2="85" y2="600" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="179" y="14" width="144" height="46" rx="9" fill="#DEE8F6" stroke="#6A93CF" stroke-width="1.6"/><text x="251.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">Plugin server</text><line x1="251" y1="60" x2="251" y2="600" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="345" y="14" width="144" height="46" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="417.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">FastAPI backend</text><line x1="417" y1="60" x2="417" y2="600" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="511" y="14" width="144" height="46" rx="9" fill="#E8DDF5" stroke="#A07CD0" stroke-width="1.6"/><text x="583.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">Ollama phi4-mini</text><line x1="583" y1="60" x2="583" y2="600" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="677" y="14" width="144" height="46" rx="9" fill="#E8EBF2" stroke="#B9C0CE" stroke-width="1.6"/><text x="749.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">PostgreSQL</text><line x1="749" y1="60" x2="749" y2="600" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="843" y="14" width="144" height="46" rx="9" fill="#D6EDEA" stroke="#5BAA9F" stroke-width="1.6"/><text x="915.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">Wazuh mgr → agent</text><line x1="915" y1="60" x2="915" y2="600" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><polyline points="417,100 912,100" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="93" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">1. hunt query: newest events for the agent (indexer)</text><polyline points="417,138 580,138" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="131" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">2. prompt: alert + &lt;context&gt; marked as data</text><polyline points="583,176 420,176" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="169" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">3. proposal as schema-constrained JSON</text><polyline points="417,204 451,204 451,220 420,220" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="459" y="216" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">4. five guardrail checks (code)</text><polyline points="417,252 746,252" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="245" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">5. proposal + guardrail rows; checkpoint at interrupt()</text><polyline points="85,290 248,290" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="93" y="283" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">6. opens approval queue in the Wazuh session</text><polyline points="251,328 414,328" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="259" y="321" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">7. GET /queue (X-Guardrail-Token, resolved analyst)</text><polyline points="85,366 248,366" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="93" y="359" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">8. Approve + justification</text><polyline points="251,404 414,404" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="259" y="397" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">9. POST /approve with the analyst&#x27;s own Wazuh token</text><polyline points="417,442 746,442" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="435" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">10. decision row (who, when, why)</text><polyline points="417,480 912,480" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="473" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">11. PUT /active-response  !firewall-drop</text><polyline points="915,518 420,518" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="511" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">12. affected_items / failed_items</text><polyline points="417,556 746,556" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="549" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">13. execution row, or execution_failed</text><text x="500" y="612" font-size="12.5" font-weight="400" fill="#C0504D" text-anchor="middle" font-style="italic">A proposal that fails a check stops after step 5: it is logged and never reaches the queue.</text></svg>