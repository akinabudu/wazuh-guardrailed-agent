<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="Calibri, Carlito, sans-serif">
  <title>Figure 3.5 - Human-in-the-loop approval and remediation sequence</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.5 L7.5 4 L0 7.5 z" fill="#5f6672"/>
    </marker>
    <style>
      .lbl  { font-size: 11px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .sub  { font-size: 8px; fill: #5a6069; text-anchor: middle; }
      .msg  { font-size: 9px; fill: #3c4149; text-anchor: middle; }
      .note { font-size: 8.5px; font-style: italic; fill: #c0392b; text-anchor: middle; }
      .ln   { stroke: #5f6672; stroke-width: 1.1; fill: none; marker-end: url(#a); }
      .life { stroke: #b6bbc2; stroke-width: 1; stroke-dasharray: 4 4; }
      .bx   { stroke-width: 1; rx: 5; }
      .infra  { fill: #eceef1; stroke: #c3c7cd; }
      .human  { fill: #dce7f7; stroke: #8fa9d8; }
      .action { fill: #d8ece4; stroke: #7fb8a0; }
    </style>
  </defs>

  <!-- lifeline heads -->
  <rect class="bx infra"  x="18"  y="20" width="118" height="34"/>
  <text class="lbl" x="77" y="41">Agent core</text>

  <rect class="bx infra"  x="166" y="20" width="118" height="34"/>
  <text class="lbl" x="225" y="41">Guardrail</text>

  <!-- NEW lifeline: the plugin server is what actually talks to the backend -->
  <rect class="bx infra"  x="314" y="20" width="132" height="34"/>
  <text class="lbl" x="380" y="37">Plugin server</text>
  <text class="sub" x="380" y="48">in Wazuh dashboard</text>

  <rect class="bx infra"  x="476" y="20" width="132" height="34"/>
  <text class="lbl" x="542" y="37">Analyst</text>
  <text class="sub" x="542" y="48">Wazuh session</text>

  <rect class="bx infra"  x="638" y="20" width="104" height="34"/>
  <text class="lbl" x="690" y="41">Wazuh AR</text>

  <!-- lifelines -->
  <line class="life" x1="77"  y1="54" x2="77"  y2="288"/>
  <line class="life" x1="225" y1="54" x2="225" y2="288"/>
  <line class="life" x1="380" y1="54" x2="380" y2="288"/>
  <line class="life" x1="542" y1="54" x2="542" y2="288"/>
  <line class="life" x1="690" y1="54" x2="690" y2="288"/>

  <!-- 1 -->
  <text class="msg" x="151" y="86">1. proposal</text>
  <path class="ln" d="M77 94 H221"/>

  <!-- 2 -->
  <text class="msg" x="302" y="124">2. validated proposal</text>
  <path class="ln" d="M225 132 H376"/>
  <text class="note" x="302" y="150">(fails a check &#8594; blocked, logged, never reaches analyst)</text>

  <!-- 3 : server renders the card to the browser -->
  <text class="msg" x="461" y="180">3. renders approval card</text>
  <path class="ln" d="M380 188 H538"/>

  <!-- 4 : analyst decides, identity taken from the Wazuh session -->
  <text class="msg" x="461" y="212">4. approve (identity from session)</text>
  <path class="ln" d="M542 220 H384"/>

  <!-- 5 : ONLY the plugin server calls out, signed, with the analyst's token -->
  <text class="msg" x="535" y="248">5. execute &#8212; analyst&#8217;s Wazuh token</text>
  <path class="ln" d="M380 256 H686"/>

  <!-- 6 -->
  <text class="msg" x="535" y="278">6. outcome logged</text>
  <path class="ln" d="M690 286 H384"/>
</svg>
