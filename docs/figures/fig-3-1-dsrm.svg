<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" font-family="Calibri, 'Segoe UI', Lato, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="12" y="30" width="148" height="66" rx="9" fill="#E8EBF2" stroke="#B9C0CE" stroke-width="1.6"/><text x="86.0" y="60.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">1. Problem</text><text x="86.0" y="76.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">identification</text><rect x="176" y="30" width="148" height="66" rx="9" fill="#DEE8F6" stroke="#6A93CF" stroke-width="1.6"/><text x="250.0" y="60.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">2. Define</text><text x="250.0" y="76.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">objectives</text><polyline points="161,63 174,63" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="340" y="30" width="148" height="66" rx="9" fill="#E8DDF5" stroke="#A07CD0" stroke-width="1.6"/><text x="414.0" y="60.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">3. Design &amp;</text><text x="414.0" y="76.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">development</text><polyline points="325,63 338,63" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="504" y="30" width="148" height="66" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="578.0" y="60.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">4. Demonstration</text><text x="578.0" y="76.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">(lab prototype)</text><polyline points="489,63 502,63" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="668" y="30" width="148" height="66" rx="9" fill="#D6EDEA" stroke="#5BAA9F" stroke-width="1.6"/><text x="742.0" y="60.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">5. Evaluation</text><text x="742.0" y="76.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">(detection, injection)</text><polyline points="653,63 666,63" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="832" y="30" width="148" height="66" rx="9" fill="#E8EBF2" stroke="#B9C0CE" stroke-width="1.6"/><text x="906.0" y="60.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">6. Communication</text><text x="906.0" y="76.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">(thesis, repository)</text><polyline points="817,63 830,63" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="750,96 750,128 414,128 414,100" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="582" y="146" font-size="12" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">each evaluation result fed back into design and development</text><rect x="30" y="172" width="225" height="78" rx="9" fill="#FFFFFF" stroke="#B9C0CE" stroke-width="1.6"/><text x="142.5" y="201.175" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">Iteration 1 · Jul 2026</text><text x="142.5" y="216.3" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">agent loop, guardrail engine,</text><text x="142.5" y="230.675" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">FastAPI backend</text><rect x="270" y="172" width="225" height="78" rx="9" fill="#FFFFFF" stroke="#B9C0CE" stroke-width="1.6"/><text x="382.5" y="201.175" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">Iteration 2 · Sep 2026</text><text x="382.5" y="216.3" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">lab deployment; structured output,</text><text x="382.5" y="230.675" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">evidence IDs, target-shape check</text><rect x="510" y="172" width="225" height="78" rx="9" fill="#FFFFFF" stroke="#B9C0CE" stroke-width="1.6"/><text x="622.5" y="201.175" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">Iteration 3 · Oct 2026</text><text x="622.5" y="216.3" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">harness; whole-event context,</text><text x="622.5" y="230.675" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">!firewall-drop, Ollama restart</text><rect x="750" y="172" width="225" height="78" rx="9" fill="#FFFFFF" stroke="#B9C0CE" stroke-width="1.6"/><text x="862.5" y="201.175" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">Iteration 4 · Oct 2026</text><text x="862.5" y="216.3" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">protected addresses, monitored host,</text><text x="862.5" y="230.675" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">enrich target check</text><text x="500" y="285" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">Each later iteration was triggered by a test result: truncated evidence IDs (smoke test),</text><text x="500" y="303" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">Wazuh error 1652 and the Ollama outage (evaluation run), and the steered proposals that passed</text><text x="500" y="321" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">the guardrails in the injection suite (iteration 4, re-evaluated in Section 5.2).</text></svg>