<svg xmlns="http://www.w3.org/2000/svg" width="860" height="850" viewBox="0 0 860 850" font-family="Calibri, 'Segoe UI', Lato, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="220" y="20" width="400" height="56" rx="9" fill="#E8DDF5" stroke="#A07CD0" stroke-width="1.6"/><text x="420.0" y="53.2" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Proposed action (from the model)</text><rect x="170" y="108" width="500" height="92" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="150.7625" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">1. Schema</text><text x="420.0" y="168.3875" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">Pydantic v2: well-formed object, required fields</text><polyline points="420,78 420,106" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="670,154 712,154 712,420 735,420" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="170" y="230" width="500" height="92" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="272.7625" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">2. Allowlist</text><text x="420.0" y="290.3875" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">action is in ALLOWED_ACTIONS</text><polyline points="420,200 420,228" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="670,276 712,276 712,420 735,420" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="170" y="352" width="500" height="92" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="386.325" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">3. Target shape</text><text x="420.0" y="403.95" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">block_ip → IP address · kill_process → process id</text><text x="420.0" y="420.825" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">enrich → address, host name or file hash</text><text x="662" y="365" font-size="10.5" font-weight="700" fill="#C0504D" text-anchor="end" font-style="italic">enrich rule: iteration 4</text><polyline points="420,322 420,350" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="670,398 712,398 712,420 735,420" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="170" y="474" width="500" height="92" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="508.325" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">4. Blast radius</text><text x="420.0" y="525.95" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">no crown-jewel name · no protected network address</text><text x="420.0" y="542.825" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">not the monitored host&#x27;s own address · ≤ 5 hosts</text><text x="662" y="487" font-size="10.5" font-weight="700" fill="#C0504D" text-anchor="end" font-style="italic">addresses: iteration 4</text><polyline points="420,444 420,472" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="670,520 712,520 712,420 735,420" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="170" y="596" width="500" height="92" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="630.325" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">5. Evidence grounding</text><text x="420.0" y="647.95" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">every cited event ID exists in the indexer</text><text x="420.0" y="664.825" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">(not required for read-only enrich)</text><polyline points="420,566 420,594" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="670,642 712,642 712,420 735,420" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="737" y="380" width="110" height="80" rx="9" fill="#F7DADB" stroke="#D0676C" stroke-width="1.6"/><text x="792.0" y="409.25" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">Blocked</text><text x="792.0" y="425.625" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">logged</text><text x="792.0" y="441.25" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">no analyst</text><polyline points="420,688 420,716" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="170" y="718" width="500" height="76" rx="9" fill="#D6EDEA" stroke="#5BAA9F" stroke-width="1.6"/><text x="420.0" y="752.7625" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Tier router</text><text x="420.0" y="770.3875" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">auto (enrich, rate-limited circuit breaker) · human · elevated</text><text x="420" y="822" font-size="13" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">Failing any check blocks the proposal; the reason is written to audit_log.</text></svg>