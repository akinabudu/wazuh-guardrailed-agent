<svg xmlns="http://www.w3.org/2000/svg" width="880" height="961" viewBox="0 0 880 961" font-family="Calibri, 'Segoe UI', Lato, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="220" y="20" width="400" height="56" rx="9" fill="#E8DDF5" stroke="#A07CD0" stroke-width="1.6"/><text x="420.0" y="53.2" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Proposal (from the model)</text><rect x="120" y="108" width="600" height="92" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="142.325" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">1. Schema</text><text x="420.0" y="159.95" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">strict type: action, target, reason (up to 2,000 characters),</text><text x="420.0" y="176.825" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">evidence ids, affected hosts, optional ATT&amp;CK technique</text><polyline points="420,78 420,106" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="720,154.0 752,154.0 752,520 765,520" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="120" y="230" width="600" height="80" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="266.7625" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">2. Allowlist</text><text x="420.0" y="284.3875" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">enrich · escalate · block_ip · kill_process · isolate_host · disable_account</text><polyline points="420,200 420,228" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="720,270.0 752,270.0 752,520 765,520" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="120" y="340" width="600" height="92" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="374.325" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">3. Target</text><text x="420.0" y="391.95" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">block_ip: IP address · kill_process: process id · disable_account: user name</text><text x="420.0" y="408.825" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">isolate_host, escalate: host · enrich: address, host or hash (never a URL)</text><polyline points="420,310 420,338" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="720,386.0 752,386.0 752,520 765,520" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="120" y="462" width="600" height="92" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="496.325" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">4. Blast radius</text><text x="420.0" y="513.95" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">not a protected address · not the monitored endpoint</text><text x="420.0" y="530.825" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">not a listed critical asset · at most five hosts</text><polyline points="420,432 420,460" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="720,508.0 752,508.0 752,520 765,520" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="120" y="584" width="600" height="112" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="619.8875" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">5. Evidence</text><text x="420.0" y="637.5125" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">1-20 cited events; each exists in the indexer, is on the investigated</text><text x="420.0" y="654.3875" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">agent and inside the window; one mentions the target</text><text x="420.0" y="671.2625" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">indexer unreachable: fail closed · ATT&amp;CK mismatch: note only</text><polyline points="420,554 420,582" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="720,640.0 752,640.0 752,520 765,520" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="120" y="726" width="600" height="80" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="420.0" y="762.7625" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Circuit breaker</text><text x="420.0" y="780.3875" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">automatic tier only: at most 10 passing proposals per sliding hour</text><polyline points="420,696 420,724" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="720,766.0 752,766.0 752,520 765,520" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="767" y="480" width="105" height="80" rx="9" fill="#F7DADB" stroke="#D0676C" stroke-width="1.6"/><text x="819.5" y="509.25" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">Blocked</text><text x="819.5" y="525.625" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">logged</text><text x="819.5" y="541.25" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">no analyst</text><polyline points="420,806 420,834" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><rect x="120" y="836" width="600" height="76" rx="9" fill="#D6EDEA" stroke="#5BAA9F" stroke-width="1.6"/><text x="420.0" y="870.7625" font-size="16" font-weight="700" fill="#1F2430" text-anchor="middle">Tier router</text><text x="420.0" y="888.3875" font-size="13.5" font-weight="400" fill="#4C5466" text-anchor="middle">auto (enrich) · human (analyst approval) · elevated (fails closed)</text><text x="440" y="940" font-size="13" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">Each stage is applied in order; the first failure stops the proposal and is recorded as the deciding stage.</text></svg>