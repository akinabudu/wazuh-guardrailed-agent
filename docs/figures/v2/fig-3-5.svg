<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Calibri, 'Segoe UI', Lato, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="13" y="14" width="144" height="46" rx="9" fill="#DEE8F6" stroke="#6A93CF" stroke-width="1.6"/><text x="85.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">Analyst (browser)</text><line x1="85" y1="60" x2="85" y2="610" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="179" y="14" width="144" height="46" rx="9" fill="#DEE8F6" stroke="#6A93CF" stroke-width="1.6"/><text x="251.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">Plugin server</text><line x1="251" y1="60" x2="251" y2="610" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="345" y="14" width="144" height="46" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="417.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">FastAPI backend</text><line x1="417" y1="60" x2="417" y2="610" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="511" y="14" width="144" height="46" rx="9" fill="#E8DDF5" stroke="#A07CD0" stroke-width="1.6"/><text x="583.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">Bedrock Opus 4.6</text><line x1="583" y1="60" x2="583" y2="610" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="677" y="14" width="144" height="46" rx="9" fill="#E8EBF2" stroke="#B9C0CE" stroke-width="1.6"/><text x="749.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">PostgreSQL</text><line x1="749" y1="60" x2="749" y2="610" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="843" y="14" width="144" height="46" rx="9" fill="#D6EDEA" stroke="#5BAA9F" stroke-width="1.6"/><text x="915.0" y="41.3875" font-size="13.5" font-weight="700" fill="#1F2430" text-anchor="middle">Wazuh (indexer, mgr)</text><line x1="915" y1="60" x2="915" y2="610" stroke="#C3C8D3" stroke-width="1.4" stroke-dasharray="5 5"/><polyline points="417,100 912,100" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="93" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">1. four recorded queries: trigger, same rule, shared indicator, window</text><polyline points="417,139 580,139" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="132" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">2. prompt: &lt;alert&gt; and &lt;context&gt;, marked as data</text><polyline points="583,178 420,178" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="171" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">3. one proposal as schema-constrained JSON</text><polyline points="417,207 451,207 451,223 420,223" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="459" y="219" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">4. five checks (cited events re-read), then the breaker</text><polyline points="417,256 746,256" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="249" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">5. proposal and guardrail rows; checkpoint at interrupt()</text><polyline points="85,295 248,295" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="93" y="288" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">6. opens the queue in the Wazuh dashboard</text><polyline points="251,334 414,334" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="259" y="327" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">7. GET /queue, HMAC-signed, analyst named from the session</text><polyline points="85,373 248,373" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="93" y="366" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">8. Approve + justification</text><polyline points="251,412 414,412" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="259" y="405" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">9. POST /approve: signed, timestamp + one-time nonce, analyst&#x27;s Wazuh token</text><polyline points="417,451 746,451" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="444" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">10. compare-and-set pending to approved; decision row</text><polyline points="417,490 912,490" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="483" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">11. PUT /active-response firewall-drop, with the analyst&#x27;s token</text><polyline points="915,529 420,529" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="522" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">12. affected_items / failed_items</text><polyline points="417,568 746,568" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="425" y="561" font-size="12.5" font-weight="400" fill="#1F2430" text-anchor="start">13. execution row, or execution_failed</text><text x="500" y="630" font-size="12.5" font-weight="400" fill="#C0504D" text-anchor="middle" font-style="italic">A stopped proposal ends after step 5. A forged, replayed, stale or second decision is refused at step 9 or 10.</text></svg>