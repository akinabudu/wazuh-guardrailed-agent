<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Calibri, 'Segoe UI', Lato, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="500" y="28" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">The model runs only in hunt_and_propose. Every other step is deterministic code.</text><text x="500" y="50" font-size="13" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">A PostgreSQL checkpointer saves the state at interrupt(), so a paused investigation survives a restart.</text><rect x="20" y="150" width="170" height="70" rx="9" fill="#E8DDF5" stroke="#A07CD0" stroke-width="1.6"/><text x="105.0" y="182.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">hunt_and_propose</text><text x="105.0" y="198.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">retrieval + model call</text><rect x="225" y="150" width="190" height="70" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="320.0" y="182.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">guardrail</text><text x="320.0" y="198.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">five checks, then breaker</text><rect x="450" y="155" width="150" height="60" rx="9" fill="#FFFFFF" stroke="#B9C0CE" stroke-width="1.6" stroke-dasharray="6 4"/><text x="525.0" y="182.3625" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">route</text><text x="525.0" y="197.4875" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">conditional edge</text><rect x="650" y="60" width="150" height="62" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="725.0" y="88.3625" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">auto_approve</text><text x="725.0" y="103.4875" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">enrich only</text><rect x="650" y="190" width="150" height="62" rx="9" fill="#DEE8F6" stroke="#6A93CF" stroke-width="1.6"/><text x="725.0" y="218.3625" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">human_gate</text><text x="725.0" y="233.4875" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">interrupt()</text><rect x="845" y="60" width="135" height="62" rx="9" fill="#D6EDEA" stroke="#5BAA9F" stroke-width="1.6"/><text x="912.5" y="88.3625" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">execute</text><text x="912.5" y="103.4875" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">active response</text><ellipse cx="912" cy="340" rx="62" ry="26" fill="#F3F4F7" stroke="#8C93A3" stroke-width="1.6"/><text x="912" y="345" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">END</text><polyline points="190,185 223,185" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="415,185 448,185" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="600,170 625,170 625,91 648,91" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="618" y="84" font-size="12" font-weight="400" fill="#4C5466" text-anchor="end" font-style="italic">auto</text><polyline points="600,200 625,200 625,221 648,221" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="620" y="240" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="end" font-style="italic">human / elevated</text><polyline points="525,215 525,340 848,340" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="690" y="332" font-size="12" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">blocked by a check or the breaker: logged, no analyst</text><polyline points="800,91 843,91" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="800,221 822,221 822,111 843,111" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="830" y="172" font-size="12" font-weight="400" fill="#4C5466" text-anchor="start" font-style="italic">approved</text><text x="830" y="186" font-size="11" font-weight="400" fill="#4C5466" text-anchor="start" font-style="italic">(resume once)</text><polyline points="725,252 725,300 858,326" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="717" y="285" font-size="12" font-weight="400" fill="#4C5466" text-anchor="end" font-style="italic">rejected</text><polyline points="912,122 912,312" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="904" y="270" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="end" font-style="italic">executed or execution_failed</text><text x="500" y="410" font-size="12.5" font-weight="400" fill="#C0504D" text-anchor="middle" font-style="italic">Elevated actions (disable_account) need a second approver, which is not implemented, so they cannot be approved.</text></svg>