<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Calibri, 'Segoe UI', Lato, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="500" y="28" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">The LLM runs only in hunt_and_propose. Every other node is deterministic code.</text><text x="500" y="50" font-size="13" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">A PostgresSaver checkpointer persists state, so interrupt() survives restarts.</text><rect x="20" y="150" width="170" height="70" rx="9" fill="#E8DDF5" stroke="#A07CD0" stroke-width="1.6"/><text x="105.0" y="182.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">hunt_and_propose</text><text x="105.0" y="198.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">only LLM node</text><rect x="225" y="150" width="170" height="70" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="310.0" y="182.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">guardrail_node</text><text x="310.0" y="198.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">5 checks (code)</text><rect x="430" y="150" width="170" height="70" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="515.0" y="182.0625" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">tier_router</text><text x="515.0" y="198.4375" font-size="12.5" font-weight="400" fill="#4C5466" text-anchor="middle">conditional edge</text><rect x="650" y="74" width="150" height="62" rx="9" fill="#FBE6D0" stroke="#E0A24E" stroke-width="1.6"/><text x="725.0" y="102.3625" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">auto_approve</text><text x="725.0" y="117.4875" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">enrich, rate-limited</text><rect x="650" y="160" width="150" height="62" rx="9" fill="#DEE8F6" stroke="#6A93CF" stroke-width="1.6"/><text x="725.0" y="188.3625" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">human_gate</text><text x="725.0" y="203.4875" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">interrupt()</text><rect x="845" y="74" width="135" height="62" rx="9" fill="#D6EDEA" stroke="#5BAA9F" stroke-width="1.6"/><text x="912.5" y="102.3625" font-size="14" font-weight="700" fill="#1F2430" text-anchor="middle">execute</text><text x="912.5" y="117.4875" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="middle">active response</text><ellipse cx="912" cy="300" rx="62" ry="26" fill="#F3F4F7" stroke="#8C93A3" stroke-width="1.6"/><text x="912" y="305" font-size="15" font-weight="700" fill="#1F2430" text-anchor="middle">END</text><polyline points="190,185 223,185" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="395,185 428,185" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="600,175 625,175 625,105 648,105" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="628" y="96" font-size="12" font-weight="400" fill="#4C5466" text-anchor="end" font-style="italic">auto</text><polyline points="600,190 648,190" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="612" y="240" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="end" font-style="italic">human / elevated</text><polyline points="600,205 625,205 625,300 848,300" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="736" y="318" font-size="12" font-weight="400" fill="#4C5466" text-anchor="middle" font-style="italic">blocked: logged, no analyst</text><polyline points="800,105 843,105" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><polyline points="800,180 822,180 822,120 843,120" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="828" y="160" font-size="12" font-weight="400" fill="#4C5466" text-anchor="start" font-style="italic">approved</text><polyline points="725,222 725,262 858,282" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="717" y="250" font-size="12" font-weight="400" fill="#4C5466" text-anchor="end" font-style="italic">rejected</text><polyline points="912,136 912,272" fill="none" stroke="#4A5263" stroke-width="1.7" marker-end="url(#head)"/><text x="904" y="236" font-size="11.5" font-weight="400" fill="#4C5466" text-anchor="end" font-style="italic">outcome or execution_failed</text><text x="500" y="360" font-size="12.5" font-weight="400" fill="#C0504D" text-anchor="middle" font-style="italic">Elevated actions (disable_account) need a second approver; that flow is not implemented, so they fail closed.</text></svg>